.main{padding:0 10px 18px}.page{display:none}.page.active{display:block}.section{font-size:12px;color:var(--muted);letter-spacing:1.2px;margin:14px 5px 8px}.card{background:var(--card);border:1px solid #EFE5DE;border-radius:22px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}

.qrGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.qrBox{position:relative;aspect-ratio:1;border-radius:16px;background:var(--soft);display:grid;place-items:center;overflow:hidden}.qrBox input{position:absolute;inset:0;opacity:0}.qrBox img{width:100%;height:100%;object-fit:contain;display:none}.qrBox span{font-size:10px;color:var(--muted)}

/* ===== v15 fixes ===== */
.markerIconPlain{width:34px;flex:0 0 34px;display:grid;place-items:center;background:transparent;border:0;color:#746d67}
.markerIconPlain svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.expenseStats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.expenseStat{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow);min-height:88px}

.photoX{touch-action:manipulation;-webkit-tap-highlight-color:transparent;pointer-events:auto}
.galleryItem>.photoX{right:4px;top:4px}


/* v15: 預訂與地標清單垃圾桶 - 小尺寸、無底框、不越界 */
#bookingList .trashBtn, #markerList .trashBtn{
  width:26px!important;height:26px!important;min-width:26px!important;flex:0 0 26px!important;
  padding:0!important;margin-left:4px!important;border:0!important;border-radius:0!important;
  background:transparent!important;box-shadow:none!important;color:#8B7F78!important;
  font-size:15px!important;line-height:1!important;display:grid!important;place-items:center!important;
}
#markerList .listRow{overflow:hidden;padding-right:8px!important}
#markerList .grow{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* v15: 照片刪除按鈕提升觸控命中與層級 */
.photoX{z-index:50!important;pointer-events:auto!important;touch-action:manipulation!important;-webkit-user-select:none;user-select:none}
.thumb{z-index:1}


/* ===== v19 Google Maps + Google Places ===== */

  overflow:hidden;

  position:relative;
}

  height:43px;
  border-radius:13px;
  background:var(--active);

.markerActions{display:flex;align-items:center;gap:5px;max-width:82px}

const $=id=>document.getElementById(id);
function clone(v){return JSON.parse(JSON.stringify(v));}
function load(k,fallback){try{const v=JSON.parse(localStorage.getItem(k));return v??fallback}catch{return fallback}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function escapeHtml(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function escapeAttr(s=""){return escapeHtml(s)}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),1500)}


// ===== 正式部署設定 =====
// 只填 Supabase Project URL 與 Publishable/anon public key。
// 絕對不要把 service_role、sb_secret_... 或資料庫密碼放進前端。
const APP_CONFIG={
  supabaseUrl:"https://xhcsiyjqdzixmissigjo.supabase.co",
  supabasePublishableKey:"sb_publishable_f0ZgHjc1yjMva0ZzldT46Q_yC7LCt0i"
};
// 保留舊裝置 localStorage 作為相容 fallback；正式 GitHub Pages 會優先使用 APP_CONFIG。
const SUPABASE_URL_STORAGE_KEY="nitaSupabaseProjectUrl";
const SUPABASE_PUBLISHABLE_STORAGE_KEY="nitaSupabasePublishableKey";
let supabaseClient=null;
let supabaseSessionUser=null;
let supabaseProfile=null;
let supabaseTripPermissions={};
let supabaseCloudTrips=[];
let supabaseFamilyId=null;
let supabaseTripDays={};

function setSupabaseStatus(message,type=""){
  const el=$("supabaseAccountStatus");
  if(!el)return;
  el.textContent=message;
  el.className="supabaseStatus"+(type?" "+type:"");
}
function buildSupabaseClient(){
  const configuredUrl=String(APP_CONFIG.supabaseUrl||"").trim();
  const configuredKey=String(APP_CONFIG.supabasePublishableKey||"").trim();
  const url=(configuredUrl&&!configuredUrl.startsWith("PASTE_")?configuredUrl:(localStorage.getItem(SUPABASE_URL_STORAGE_KEY)||"")).trim();
  const key=(configuredKey&&!configuredKey.startsWith("PASTE_")?configuredKey:(localStorage.getItem(SUPABASE_PUBLISHABLE_STORAGE_KEY)||"")).trim();
  if(!url||!key){supabaseClient=null;return false}
  if(!window.supabase||!window.supabase.createClient){setSupabaseStatus("雲端服務載入失敗，請確認目前裝置有網路。","bad");return false}
  try{
    supabaseClient=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
    return true;
  }catch(err){setSupabaseStatus("雲端設定錯誤："+err.message,"bad");supabaseClient=null;return false}
}
function isSupabaseAdmin(){return supabaseProfile?.role==="admin"}
function cloudPermissionFor(tripId){return isSupabaseAdmin()?"ADMIN":String(supabaseTripPermissions[tripId]||"VIEWER").toUpperCase()}
function canEditCloudTrip(tripId){const p=cloudPermissionFor(tripId);return p==="ADMIN"||p==="EDITOR"}
function mergeCloudTripIntoState(t,permission,dayRows=[]){
  const existing=state.trips[t.id]||{};
  const dayCount=daysInclusive(t.start_date,t.end_date);
  const oldDays=existing.days||[];
  const days=[];
  for(let i=0;i<dayCount;i++){
    const row=dayRows[i]||{}; const old=oldDays[i]||{};
    days.push({...old,schedule:old.schedule||[],backup:old.backup||[],shopping:old.shopping||[],pocketFood:old.pocketFood||[],supabaseDayId:row.id||old.supabaseDayId||null,date:row.day_date||addDays(t.start_date,i),dayNumber:row.day_number||i+1});
  }
  state.trips[t.id]={id:t.id,flag:existing.flag||"✈️",name:t.title||"未命名旅行",start:t.start_date,end:t.end_date,city:t.city||"",country:t.country||"",hotel:existing.hotel||"",weather:existing.weather||[["⛅",28,22],["🌤️",29,22],["☀️",30,23],["🌦️",28,22],["⛅",29,23],["☀️",31,24],["🌤️",30,23]],flight:existing.flight||{out:["TPE","—","尚未設定","—"],back:["—","TPE","尚未設定","—"]},notes:t.notes||existing.notes||"",markers:existing.markers||[],days,qr:existing.qr||[],supabase:true,supabasePermission:permission};
}
async function syncCloudTripsIntoApp(){
  if(!supabaseSessionUser)return;
  const ids=supabaseCloudTrips.map(t=>t.id); supabaseTripDays={};
  if(ids.length){
    const {data:rows,error}=await supabaseClient.from("trip_days").select("id,trip_id,day_date,day_number").in("trip_id",ids).order("day_number",{ascending:true});
    if(error)throw error;
    (rows||[]).forEach(r=>(supabaseTripDays[r.trip_id]||(supabaseTripDays[r.trip_id]=[])).push(r));
  }
  supabaseCloudTrips.forEach(t=>mergeCloudTripIntoState(t,cloudPermissionFor(t.id),supabaseTripDays[t.id]||[]));
  if(ids.length && (!state.trips[state.currentTripId] || !ids.includes(state.currentTripId))) state.currentTripId=ids[0];
  persistTrips(); renderAll();
}
function renderCloudTrips(){
  const box=$("cloudTripList");if(!box)return;box.innerHTML="";
  if(!supabaseSessionUser){box.innerHTML='<div class="mini">登入後才會顯示你有權限的雲端旅程。</div>';return}
  if(!supabaseCloudTrips.length){box.innerHTML='<div class="mini">目前沒有可查看的雲端旅程。</div>';return}
  supabaseCloudTrips.forEach(t=>{
    const permission=supabaseProfile?.role==="admin"?"ADMIN":String(supabaseTripPermissions[t.id]||"VIEWER").toUpperCase();
    const row=document.createElement("div");row.className="cloudTripRow";
    row.innerHTML=`<div><div class="cloudTripName">✈️ ${escapeHtml(t.title||"未命名旅行")}</div><div class="cloudTripMeta">${escapeHtml(t.city||"")}${t.country?" · "+escapeHtml(t.country):""}<br>${escapeHtml(t.start_date||"")} — ${escapeHtml(t.end_date||"")}</div><span class="permissionPill">${permission}</span></div><button class="cloudLoadBtn" type="button">載入</button>`;
    row.querySelector(".cloudLoadBtn").onclick=()=>loadCloudTripIntoApp(t,permission);
    box.appendChild(row);
  });
}
function loadCloudTripIntoApp(t,permission){
  mergeCloudTripIntoState(t,permission,supabaseTripDays[t.id]||[]);
  state.currentTripId=t.id;state.currentDay="info";persistTrips();renderAll();
  $("tripBox").open=false;toast("已載入雲端旅程："+(t.title||"未命名旅行"));void fullCloudHydrateCurrentTrip();
}

async function refreshSupabaseAccountAndTrips(){
  if(!supabaseClient&&!buildSupabaseClient()){setSupabaseStatus("雲端服務尚未完成設定。","bad");return}
  const {data:userData,error:userErr}=await supabaseClient.auth.getUser();
  if(userErr||!userData?.user){
    supabaseSessionUser=null;supabaseProfile=null;supabaseCloudTrips=[];supabaseTripPermissions={};
    $("supabaseSummaryState").textContent="尚未登入";setSupabaseStatus("尚未登入。");renderCloudTrips();refreshAccountUI();return
  }
  supabaseSessionUser=userData.user;
  const {data:profile,error:profileErr}=await supabaseClient.from("profiles").select("id,display_name,role,account_status").eq("id",supabaseSessionUser.id).single();
  if(profileErr){setSupabaseStatus("已登入，但讀取 profiles 失敗："+profileErr.message,"bad");return}
  supabaseProfile=profile;
  const {data:familyRows,error:familyErr}=await supabaseClient.from("family_members").select("family_id").eq("user_id",supabaseSessionUser.id).limit(1);
  if(familyErr){setSupabaseStatus("讀取家庭資料失敗："+familyErr.message,"bad");return}
  supabaseFamilyId=familyRows?.[0]?.family_id||null;
  const {data:trips,error:tripErr}=await supabaseClient.from("trips").select("id,title,city,country,start_date,end_date,notes,created_by,created_at").order("start_date",{ascending:true});
  if(tripErr){setSupabaseStatus("讀取雲端旅程失敗："+tripErr.message,"bad");return}
  supabaseCloudTrips=trips||[];supabaseTripPermissions={};
  if(profile.role!=="admin"&&supabaseCloudTrips.length){
    const {data:perms,error:permErr}=await supabaseClient.from("trip_members").select("trip_id,permission").eq("user_id",supabaseSessionUser.id);
    if(permErr){setSupabaseStatus("旅程讀到了，但讀取 VIEWER / EDITOR 權限失敗："+permErr.message,"bad");return}
    (perms||[]).forEach(x=>supabaseTripPermissions[x.trip_id]=x.permission);
  }
  const roleText=profile.role==="admin"?"ADMIN":"MEMBER";
  $("supabaseSummaryState").textContent=roleText;
  refreshAccountUI();
  setSupabaseStatus(`登入成功\n${profile.display_name?"名稱："+profile.display_name+"\n":""}帳號：${supabaseSessionUser.email||""}\nRole：${profile.role}\nStatus：${profile.account_status}\n可查看雲端旅程：${supabaseCloudTrips.length} 趟`,profile.account_status==="active"?"ok":"bad");
  renderCloudTrips();
  try{await syncCloudTripsIntoApp()}catch(e){setSupabaseStatus("帳號已登入，但同步 trip_days 失敗："+e.message,"bad")}
}
function setupSupabaseStageOne(){
  const storedUrl=localStorage.getItem(SUPABASE_URL_STORAGE_KEY)||"";
  const storedKey=localStorage.getItem(SUPABASE_PUBLISHABLE_STORAGE_KEY)||"";
  if($("supabaseUrlInput"))$("supabaseUrlInput").value=storedUrl;
  if($("supabaseKeyInput"))$("supabaseKeyInput").value=storedKey;
  buildSupabaseClient();
  renderCloudTrips();
  $("saveSupabaseConfigBtn").onclick=()=>{
    const u=$("supabaseUrlInput").value.trim(),k=$("supabaseKeyInput").value.trim();
    if(!u||!k){setSupabaseStatus("雲端服務尚未完成設定。","bad");return}
    localStorage.setItem(SUPABASE_URL_STORAGE_KEY,u);localStorage.setItem(SUPABASE_PUBLISHABLE_STORAGE_KEY,k);
    buildSupabaseClient();setSupabaseStatus("雲端設定已儲存。","ok");
  };
  $("clearSupabaseConfigBtn").onclick=async()=>{
    if(supabaseClient){try{await supabaseClient.auth.signOut()}catch(_){}}
    localStorage.removeItem(SUPABASE_URL_STORAGE_KEY);localStorage.removeItem(SUPABASE_PUBLISHABLE_STORAGE_KEY);
    $("supabaseUrlInput").value="";$("supabaseKeyInput").value="";supabaseClient=null;supabaseSessionUser=null;supabaseProfile=null;supabaseCloudTrips=[];supabaseTripPermissions={};
    $("supabaseSummaryState").textContent="尚未登入";setSupabaseStatus("已清除雲端設定。");renderCloudTrips();
  };
  $("supabaseLoginBtn").onclick=async()=>{
    if(!supabaseClient&&!buildSupabaseClient()){setSupabaseStatus("雲端服務尚未完成設定。","bad");return}
    const email=$("supabaseEmailInput").value.trim(),password=$("supabasePasswordInput").value;
    if(!email||!password){setSupabaseStatus("Email 與 Password 都要填。","bad");return}
    setSupabaseStatus("登入中…");
    const {error}=await supabaseClient.auth.signInWithPassword({email,password});
    if(error){setSupabaseStatus("登入失敗："+error.message,"bad");return}
    $("supabasePasswordInput").value="";await refreshSupabaseAccountAndTrips();
  };
  $("supabaseLogoutBtn").onclick=async()=>{
    if(supabaseClient)await supabaseClient.auth.signOut();
    supabaseSessionUser=null;supabaseProfile=null;supabaseCloudTrips=[];supabaseTripPermissions={};
    $("supabaseSummaryState").textContent="尚未登入";setSupabaseStatus("已登出。");renderCloudTrips();refreshAccountUI();
  };
  $("refreshCloudTripsBtn").onclick=refreshSupabaseAccountAndTrips;
  if(supabaseClient){supabaseClient.auth.getSession().then(({data})=>{if(data?.session?.user)refreshSupabaseAccountAndTrips()}).catch(()=>{})}
}

const DEFAULT_TRIPS={
 bangkok:{id:"bangkok",flag:"🇹🇭",name:"Bangkok 2026",start:"2026-09-12",end:"2026-09-17",city:"Bangkok",hotel:"",weather:[["🌦️",31,26],["⛅",32,26],["🌧️",30,25],["🌤️",33,27],["🌦️",31,26],["☀️",34,27],["⛅",32,26]],flight:{out:["TPE","BKK","TG637 · 09:40","12:35 抵達"],back:["BKK","TPE","TG636 · 14:10","18:55 抵達"]},notes:"• 護照效期請確認至少 6 個月以上。\n• 部分寺廟需注意服裝規定。",markers:["☕ Factory Coffee","🍜 Jeh O","🛍 Gentlewoman","📷 Wat Arun"],days:[],qr:[]},
 seoul:{id:"seoul",flag:"🇰🇷",name:"Seoul 2027",start:"2027-05-15",end:"2027-05-20",city:"Seoul",hotel:"",weather:[["☀️",23,13],["🌤️",24,14],["⛅",22,13],["🌦️",21,12],["☀️",25,14],["🌤️",24,15],["☀️",26,16]],flight:{out:["TPE","ICN","BR160 · 15:15","18:45 抵達"],back:["ICN","TPE","BR159 · 19:45","21:35 抵達"]},notes:"• 入境前確認 K-ETA / 最新入境規定。",markers:["🥯 London Bagel Museum","☕ Cafe Onion","🛍 The Hyundai Seoul","📷 Bukchon"],days:[],qr:[]}
};
let state={trips:load("travelTripsV13",clone(DEFAULT_TRIPS)),currentTripId:load("currentTripIdV13","bangkok"),currentDay:"info",bookings:load("travelBookingsV13",[]),expenses:load("travelExpensesV13",[]),journal:load("travelJournalV13",[]),planning:load("travelPlanningV13",{todo:[],packing:[],shopping:[],members:[]}),currentPlan:"todo",payers:load("travelPayersV20",["Rok","Nita"]),markerTypes:load("travelMarkerTypesV20",["📍 地標","🍜 餐廳","☕ 咖啡","📷 景點","🛍 購物"])};
let calendarTarget=null,calYear=2026,calMonth=8,pendingDate="2026-09-12",viewerImages=[],viewerIndex=0,formSubmit=null;

function currentTrip(){return state.trips[state.currentTripId]}
function persistTrips(){save("travelTripsV13",state.trips);save("currentTripIdV13",state.currentTripId)}
function fmtZh(iso){const [y,m,d]=iso.split("-").map(Number);return `${y}年${m}月${d}日`}
function fmtSlash(iso){return iso.replaceAll("-","/")}
function addDays(iso,n){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function daysInclusive(a,b){return Math.max(1,Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000)+1)}
function dow(iso){return ["SUN","MON","TUE","WED","THU","FRI","SAT"][new Date(iso+"T12:00:00").getDay()]}
function ensureDays(t){const n=daysInclusive(t.start,t.end);t.days=t.days||[];while(t.days.length<n)t.days.push({schedule:[],backup:[],shopping:[],pocketFood:[]});t.days=t.days.slice(0,n);t.days.forEach(d=>{d.schedule=d.schedule||[];d.backup=d.backup||[];d.shopping=d.shopping||[];d.pocketFood=d.pocketFood||[]})}

function renderAll(){if(!state.trips[state.currentTripId])state.currentTripId=Object.keys(state.trips)[0];const t=currentTrip();ensureDays(t);$("topTripName").textContent=`${t.flag||"✈️"} ${t.name}`;$("topTripDate").textContent=`${fmtSlash(t.start)} — ${fmtSlash(t.end)}`;$("startDateValue").value=t.start;$("endDateValue").value=t.end;$("startDateBtn").textContent=fmtZh(t.start);$("endDateBtn").textContent=fmtZh(t.end);$("newTripName").value=t.name;renderTripList();renderDayTabs();renderSchedulePage();renderBookings();renderMapPage();renderExpenses();renderJournal();renderPlanning();persistTrips();applyLoggedOutWriteLock()}

function renderTripList(){const box=$("tripList");box.innerHTML="";Object.values(state.trips).filter(t=>!supabaseSessionUser||t.supabase).forEach(t=>{const row=document.createElement("div");row.className="tripItem"+(t.id===state.currentTripId?" active":"");const canDelete=t.supabase?isSupabaseAdmin():true;row.innerHTML=`<button class="tripPick" type="button"><span>${t.flag||"✈️"} ${escapeHtml(t.name)}</span><span>${t.start.slice(5).replace("-","/")}—${t.end.slice(5).replace("-","/")}</span></button>${canDelete?'<button class="deleteBtn" type="button">刪除</button>':''}`;row.querySelector(".tripPick").onclick=()=>{state.currentTripId=t.id;state.currentDay="info";renderAll();$("tripBox").open=false;if(t.supabase)void fullCloudHydrateCurrentTrip()};const del=row.querySelector(".deleteBtn");if(del)del.onclick=()=>deleteTrip(t.id);box.appendChild(row)})}
async function deleteTrip(id){
  const t=state.trips[id];
  if(t?.supabase){
    if(!isSupabaseAdmin()){toast("只有 ADMIN 可以刪除整趟旅程");return}

function weatherEmoji(code){
  if(code===0)return "☀️";
  if([1,2].includes(code))return "🌤️";
  if(code===3)return "☁️";
  if([45,48].includes(code))return "🌫️";
  if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code))return "🌧️";
  if([71,73,75,77,85,86].includes(code))return "🌨️";
  if([95,96,99].includes(code))return "⛈️";
  return "⛅";
}
async function refreshWeatherFromNetwork(){
  const t=currentTrip(),status=$("weatherStatus");
  if(!status)return;
  try{
    const query=(t.city||t.name||"").replace(/[0-9]/g,"").trim();
    const g=await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=zh&format=json&name="+encodeURIComponent(query));
    if(!g.ok)throw new Error("geocode");
    const gj=await g.json(),place=gj.results&&gj.results[0];
    if(!place)throw new Error("place");
    const start=t.start,end=t.end;
    const f=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&start_date=${start}&end_date=${end}`);
    if(!f.ok)throw new Error("forecast");
    const j=await f.json();
    if(!j.daily||!j.daily.time||!j.daily.time.length)throw new Error("no daily");
    t.weather=j.daily.time.map((_,i)=>[weatherEmoji(j.daily.weather_code[i]),Math.round(j.daily.temperature_2m_max[i]),Math.round(j.daily.temperature_2m_min[i])]);
    persistTrips();renderWeather();
    status.textContent=`已從網路更新：${place.name}${place.country?" · "+place.country:""}`;
  }catch(e){
    status.textContent="目前顯示已儲存的天氣資料；若旅行日期超出可預報範圍或網路受限，會暫時無法即時更新。";
  }
}

function cloudNormalizeUrl(raw){
  let u=String(raw||"").trim();

async function cloudLoadItineraryAssets(rows){

  const map={};ids.forEach(id=>map[id]={links:[],photos:[]});
  if(!ids.length)return map;
  const {data,error}=await supabaseClient.from("attachments")
    .select("id,trip_id,attachment_type,parent_id,file_path,file_name,mime_type,caption,uploaded_by,created_at")
    .in("parent_id",ids)
    .in("attachment_type",["itinerary_link","itinerary_photo"])
    .order("created_at",{ascending:true});
  if(error)throw error;
  for(const a of (data||[])){
    if(!map[a.parent_id])continue;
    if(a.attachment_type==="itinerary_link"){
      a.url=cloudNormalizeUrl(a.file_path||a.caption||"");
      map[a.parent_id].links.push(a);

      map[a.parent_id].photos.push(a);

    const {data:signed,error}=await supabaseClient.storage.from("travel-images").createSignedUrl(a.file_path,3600);

function cloudSafeExt(file){
  const n=String(file?.name||"");
  const ext=(n.includes(".")?n.split(".").pop():"").toLowerCase().replace(/[^a-z0-9]/g,"");
  if(ext)return ext.slice(0,8);
  const m=String(file?.type||"").toLowerCase();
  if(m.includes("png"))return "png";if(m.includes("webp"))return "webp";if(m.includes("heic"))return "heic";return "jpg";
}
async function cloudUploadItineraryPhotos(row,di,files,labelEl){
  const t=currentTrip();
  if(!cloudCanEditTrip(row.trip_id)){toast("VIEWER 只能查看，不能上傳照片");return}

  const list=[...(files||[])];if(!list.length)return;
  if(labelEl)labelEl.classList.add("cloudPhotoUploading");

      const ext=cloudSafeExt(f);
      const filename=`itinerary-${row.id}-${Date.now()}-${i}.${ext}`;
      const path=`${t.id}/${supabaseSessionUser.id}/${filename}`;
      const {error:upErr}=await supabaseClient.storage.from("travel-images").upload(path,f,{upsert:false,contentType:f.type||undefined});
      if(upErr){toast("照片上傳失敗："+upErr.message);continue}
      const {error:dbErr}=await supabaseClient.from("attachments").insert({
        trip_id:row.trip_id,

        parent_id:row.id,
        file_path:path,
        file_name:f.name||filename,
        mime_type:f.type||null,

      if(dbErr){await supabaseClient.storage.from("travel-images").remove([path]);toast("照片紀錄建立失敗："+dbErr.message);continue}
      ok++;
    }
  }finally{if(labelEl)labelEl.classList.remove("cloudPhotoUploading")}

  if(ok)toast(`已上傳 ${ok} 張照片`);
}

/* ===== v16.2 Supabase 備用行程：自動偵測真實欄位 + 網址 + Private Storage 照片 ===== */
let cloudBackupColumnMap=null;
async function cloudBackupColumnExists(col){
  const {error}=await supabaseClient.from("backup_plans").select(col).limit(1);
  return !error;
}
async function cloudGetBackupSchema(){
  if(cloudBackupColumnMap)return cloudBackupColumnMap;
  if(!supabaseClient||!supabaseSessionUser)throw new Error("請先登入");
  const candidates={
    id:["id"],trip_id:["trip_id"],trip_day_id:["trip_day_id"],created_by:["created_by"],created_at:["created_at"],
    label:["label","backup_label","backup_type","title","name","plan_name","backup_name"],
    place:["place_name","place","location","location_name","venue_name","destination"],
    description:["description","desc","notes","note","content","details"]
  };
  const map={};
  for(const [role,names] of Object.entries(candidates)){
    for(const name of names){
      if(await cloudBackupColumnExists(name)){map[role]=name;break}
    }
  }
  const missing=["id","trip_id","trip_day_id"].filter(k=>!map[k]);
  if(missing.length)throw new Error("backup_plans 缺少必要欄位："+missing.join(", "));
  cloudBackupColumnMap=map;
  console.info("backup_plans 欄位偵測結果",map);
  return map;
}
function cloudBackupNormalizeRow(row,idx,map){
  return Object.assign({},row,{
    _label:map.label?(row[map.label]||`雨天備${idx+1}`):`雨天備${idx+1}`,
    _place:map.place?(row[map.place]||""):"",
    _description:map.description?(row[map.description]||""):""
  });
}
function cloudCanDeleteBackup(row){
  if(isSupabaseAdmin())return true;
  const owner=row.created_by||row._created_by;
  return cloudPermissionRaw(row.trip_id)==="editor" && !!supabaseSessionUser && owner===supabaseSessionUser.id;
}
async function cloudLoadBackupRows(di){
  const t=currentTrip(),day=t?.days?.[di];
  if(!t?.supabase||!day?.supabaseDayId)return [];
  const map=await cloudGetBackupSchema();
  let q=supabaseClient.from("backup_plans").select("*").eq(map.trip_day_id,day.supabaseDayId);
  if(map.created_at)q=q.order(map.created_at,{ascending:true});
  const {data,error}=await q;
  if(error)throw error;
  return (data||[]).map((r,i)=>cloudBackupNormalizeRow(r,i,map));
}
async function cloudLoadBackupAssets(rows){
  const ids=(rows||[]).map(r=>r.id).filter(Boolean),map={};
  ids.forEach(id=>map[id]={links:[],photos:[]});
  if(!ids.length)return map;
  const {data,error}=await supabaseClient.from("attachments")
    .select("id,trip_id,attachment_type,parent_id,file_path,file_name,mime_type,caption,uploaded_by,created_at")
    .in("parent_id",ids)
    .in("attachment_type",["backup_link","backup_photo"])
    .order("created_at",{ascending:true});
  if(error)throw error;
  for(const a of (data||[])){
    if(!map[a.parent_id])continue;
    if(a.attachment_type==="backup_link"){
      a.url=cloudNormalizeUrl(a.file_path||a.caption||"");
      map[a.parent_id].links.push(a);
    }else if(a.attachment_type==="backup_photo")map[a.parent_id].photos.push(a);
  }
  const photos=(data||[]).filter(a=>a.attachment_type==="backup_photo"&&a.file_path);
  await Promise.all(photos.map(async a=>{
    const {data:signed,error}=await supabaseClient.storage.from("travel-images").createSignedUrl(a.file_path,3600);
    a.signedUrl=error?"":(signed?.signedUrl||"");
  }));
  return map;
}
async function cloudCreateBackupPlan(di){
  const t=currentTrip(),day=t?.days?.[di];
  if(!supabaseClient||!supabaseSessionUser){toast("請先登入");return}
  if(!cloudCanEditTrip(t.id)){toast("VIEWER 只能查看，不能新增備用行程");return}
  if(!day?.supabaseDayId){toast("找不到這一天的 trip_day_id，請重新讀取雲端旅程");return}
  let map;try{map=await cloudGetBackupSchema()}catch(err){toast(err.message||String(err));return}
  let count=0;try{count=(await cloudLoadBackupRows(di)).length}catch(e){}
  const payload={[map.trip_id]:t.id,[map.trip_day_id]:day.supabaseDayId};
  if(map.label)payload[map.label]=`雨天備${count+1}`;
  if(map.place)payload[map.place]="";
  if(map.description)payload[map.description]="";
  const {error}=await supabaseClient.from("backup_plans").insert(payload);
  if(error){toast("新增備用行程失敗："+error.message);return}
  await renderCloudBackup(di);toast("已新增雲端備用行程");
}
async function cloudUpdateBackup(row,role,val,di){
  if(!cloudCanEditTrip(row.trip_id)){toast("VIEWER 只能查看，不能修改備用行程");return}
  const map=await cloudGetBackupSchema(),col=map[role];
  if(!col){toast(role==="label"?"目前 backup_plans 沒有可儲存備用名稱的欄位":role==="place"?"目前 backup_plans 沒有可儲存地點的欄位":"目前 backup_plans 沒有可儲存介紹的欄位");await renderCloudBackup(di);return}
  const {data,error}=await supabaseClient.from("backup_plans").update({[col]:val}).eq(map.id,row.id).select(map.id);
  if(error){toast("儲存備用行程失敗："+error.message);await renderCloudBackup(di);return}
  if(!data?.length){toast("這筆備用行程沒有修改權限");await renderCloudBackup(di);return}
  toast("備用行程已同步到 Supabase");
}
async function cloudDeleteBackup(row,assets,di){
  if(!cloudCanDeleteBackup(row)){toast("你只能刪除自己建立的備用行程");return}
  const map=await cloudGetBackupSchema();
  const {data,error}=await supabaseClient.from("backup_plans").delete().eq(map.id,row.id).select(map.id);
  if(error){toast("刪除備用行程失敗："+error.message);return}
  if(!data?.length){toast("這筆備用行程沒有刪除權限");return}
  for(const a of [...(assets?.photos||[])])if(a.file_path)await supabaseClient.storage.from("travel-images").remove([a.file_path]);
  await supabaseClient.from("attachments").delete().eq("parent_id",row.id).in("attachment_type",["backup_link","backup_photo"]);

function markerName(m){

}
function markerCategory(m){
  if(typeof m==="string"){

function hasGoogleApiKey(){
  return !!(GOOGLE_MAPS_API_KEY&&GOOGLE_MAPS_API_KEY.trim());
}

function loadGoogleMapsApi(){
  if(window.google?.maps){googleMapsReady=true;return Promise.resolve(window.google.maps)}
  if(googleMapsLoadPromise)return googleMapsLoadPromise;
  if(!hasGoogleApiKey()){
    setMapStatus("Google Maps API Key 尚未設定。請在上方「Google Maps API 設定」貼上 Key 並儲存。",true);
    return Promise.reject(new Error("Google Maps API Key 尚未設定"));
  }
  googleMapsLoadPromise=new Promise((resolve,reject)=>{
    const callback="__nitaGoogleMapsReady_"+Date.now();
    window[callback]=()=>{
      googleMapsReady=true;
      delete window[callback];
      resolve(window.google.maps);
      setTimeout(()=>{
        initGoogleMap(true);
        if(state.currentDay!=="info")initDayGoogleMap(true);
      },50);
    };
    const sc=document.createElement("script");
    sc.async=true;
    sc.defer=true;
    sc.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(GOOGLE_MAPS_API_KEY)}&libraries=places&v=weekly&language=zh-TW&callback=${callback}`;
    sc.onerror=()=>{delete window[callback];googleMapsLoadPromise=null;setMapStatus("Google Maps 載入失敗。請檢查 API Key、網路，以及 API 是否已啟用。",true);reject(new Error("Google Maps load failed"))};
    document.head.appendChild(sc);
  });
  return googleMapsLoadPromise;
}

function getMarkerLabelOverlayClass(){
  if(MarkerLabelOverlayClass)return MarkerLabelOverlayClass;
  if(!window.google?.maps?.OverlayView)return null;
  MarkerLabelOverlayClass=class MarkerLabelOverlay extends google.maps.OverlayView{
    constructor(position,html,onClick){
      super();this.position=position;this.html=html;this.onClick=onClick;this.div=null;
    }
    onAdd(){
      this.div=document.createElement("div");
      this.div.className="googleMarkerLabel";
      this.div.innerHTML=this.html;
      this.div.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();this.onClick?.()});
      this.getPanes().overlayMouseTarget.appendChild(this.div);
    }
    draw(){
      if(!this.div)return;
      const p=this.getProjection().fromLatLngToDivPixel(this.position);
      if(!p)return;
      this.div.style.left=p.x+"px";
      this.div.style.top=(p.y-20)+"px";
    }
    onRemove(){if(this.div){this.div.remove();this.div=null}}
  };
  return MarkerLabelOverlayClass;
}

function categoryEmoji(cat){
  const s=String(cat||"📍").trim();
  const first=(s.split(/\s+/)[0]||"📍");
  const known=["🍜","☕","📷","🛍","📍","🔖","🏮","💆","🏨","🚆","🚕","🍸","🛒","🍰","🍽️","🎡","🌳","🎁"];
  return known.includes(first)?first:"🔖";
}
function suggestMarkerEmoji(label){
  const v=String(label||"").toLowerCase();
  if(/夜市|night market/.test(v))return "🏮";
  if(/按摩|spa|massage/.test(v))return "💆";
  if(/飯店|酒店|hotel|住宿/.test(v))return "🏨";
  if(/交通|車站|捷運|metro|train|station/.test(v))return "🚆";
  if(/酒吧|bar|酒/.test(v))return "🍸";
  if(/甜點|蛋糕|dessert|cake/.test(v))return "🍰";
  if(/市場|market/.test(v))return "🛒";
  if(/咖啡|coffee|cafe/.test(v))return "☕";
  if(/餐|美食|food|restaurant/.test(v))return "🍜";
  if(/購物|逛街|shopping|mall/.test(v))return "🛍";
  if(/景點|寺|廟|museum|attraction/.test(v))return "📷";
  return "🔖";
}
function categoryEmojiToLabel(cat){

function clearGoogleMarkerSet(set){

function createGoogleMarker(map,m,set,zIndex=1){
  const pos={lat:m.lat,lng:m.lng};
  const distance=userPosition?formatDistance(distanceMeters(userPosition.lat,userPosition.lng,m.lat,m.lng)):"";
  const labelDistance=distance?`<span class="markerLabelDistance">${escapeHtml(distance)}</span>`:`<span class="markerLabelDistance">尚未定位</span>`;
  const marker=new google.maps.Marker({map,position:pos,title:m.name||"",icon:markerGoogleIcon(m.category),zIndex});
  const go=()=>openExternalUrl(googleNavUrl(m));
  marker.addListener("click",go);
  const LabelClass=getMarkerLabelOverlayClass();
  let label=null;
  if(LabelClass){
    label=new LabelClass(pos,`<span>${escapeHtml(m.name)}</span>${labelDistance}`,go);
    label.setMap(map);
  }
  set.push({marker,label});
}

function fitGoogleMap(map,points,maxZoom=15){
  if(!map||!points.length)return;
  if(points.length===1){map.setCenter(points[0]);map.setZoom(maxZoom);return}
  const bounds=new google.maps.LatLngBounds();
  points.forEach(p=>bounds.extend(p));
  map.fitBounds(bounds,42);
  const once=google.maps.event.addListenerOnce(map,"idle",()=>{if(map.getZoom()>maxZoom)map.setZoom(maxZoom)});
}

  });

function distanceMeters(lat1,lng1,lat2,lng2){
  const R=6371000,rad=x=>x*Math.PI/180;
  const dLat=rad(lat2-lat1),dLng=rad(lng2-lng1);
  const a=Math.sin(dLat/2)**2+Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLng/2)**2;
  return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function formatDistance(m){if(!Number.isFinite(m))return "";return m<1000?`${Math.round(m)} m`:`${(m/1000).toFixed(m<10000?1:0)} km`}

function googleNavUrl(m){
  const coords=Number.isFinite(m.lat)&&Number.isFinite(m.lng)?`${m.lat},${m.lng}`:"";
  const destination=coords||(m.address||"").trim()||(m.name||"").trim();
  const placePart=m.placeId?`&destination_place_id=${encodeURIComponent(m.placeId)}`:"";
  return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destination)}${placePart}&dir_action=navigate`;
}
function openExternalUrl(url){
  const u=normalizeUrl(url);if(!u)return;
  try{const w=window.open(u,"_blank");if(!w)window.location.href=u}catch(e){try{window.location.href=u}catch(_){}}
}

function renderMarkerList(){
  const list=$("markerList");if(!list)return;
  normalizeMarkers();list.innerHTML="";
  const markers=currentTrip().markers;
  if(!markers.length){list.innerHTML=`<div class="card mini">目前沒有地標。請在上方用 Google Places 搜尋店名或地址。</div>`;return}
  const order=(state.markerTypes||[]).map(normalizeCategoryValue);
  const indexed=markers.map((m,i)=>({m,i})).sort((a,b)=>{
    const ai=order.indexOf(normalizeCategoryValue(a.m.category)),bi=order.indexOf(normalizeCategoryValue(b.m.category));
    return (ai<0?999:ai)-(bi<0?999:bi)||a.m.name.localeCompare(b.m.name,"zh-Hant");
  });

function tripSearchQuery(query){
  const city=(currentTrip().city||currentTrip().name||"").trim();
  if(!city)return query;
  if(query.toLowerCase().includes(city.toLowerCase()))return query;
  return `${query}, ${city}`;
}

async function searchGooglePlaces(query){
  await loadGoogleMapsApi();
  const {Place}=await google.maps.importLibrary("places");
  const request={
    textQuery:tripSearchQuery(query),
    fields:["id","displayName","formattedAddress","location"],
    maxResultCount:8,
    language:"zh-TW"
  };
  let response=await Place.searchByText(request);
  let places=response?.places||[];
  // 若「店名＋城市」無結果，再嘗試原始輸入，避免完整地址被旅行名稱干擾。
  if(!places.length && request.textQuery!==query){
    response=await Place.searchByText({...request,textQuery:query});
    places=response?.places||[];
  }
  return places.map(pl=>({
    provider:"Google Places",
    placeId:pl.id||"",
    name:pl.displayName||query,
    address:pl.formattedAddress||"",
    lat:typeof pl.location?.lat==="function"?pl.location.lat():Number(pl.location?.lat),
    lng:typeof pl.location?.lng==="function"?pl.location.lng():Number(pl.location?.lng)
  })).filter(x=>Number.isFinite(x.lat)&&Number.isFinite(x.lng));
}

function locationErrorMessage(err){
  if(err?.code===1)return "定位權限被拒絕。iPhone 請到「設定 → 隱私權與安全性 → 定位服務」允許目前的 HTML Editor；若 App 本身沒有定位權限選項，file:// 預覽無法取得 GPS，改成 HTTPS 網址測試即可。";
  if(location.protocol==="file:")return "目前 HTML Editor 的 file:// 預覽環境沒有提供 GPS 定位。程式本身已支援定位；部署到 HTTPS 網址後，Safari 允許定位即可顯示即時位置與距離。";
  return "暫時無法取得定位，請確認定位服務與網路後再試。";
}
function startLiveLocation(){
  if(!navigator.geolocation){setMapStatus("這個 HTML Editor 不提供 Geolocation。改用 HTTPS 網址在 Safari 開啟即可使用即時定位與距離。");return}
  if(geoWatchId!==null){navigator.geolocation.clearWatch(geoWatchId);geoWatchId=null}
  setMapStatus("正在取得你的即時位置…");
  navigator.geolocation.getCurrentPosition(p=>{
    applyUserPosition(p);
    geoWatchId=navigator.geolocation.watchPosition(applyUserPosition,err=>setMapStatus(locationErrorMessage(err)),{enableHighAccuracy:true,maximumAge:3000,timeout:20000});
  },err=>setMapStatus(locationErrorMessage(err)),{enableHighAccuracy:true,maximumAge:0,timeout:20000});
}

function normalizeUrl(url){let u=String(url||"").trim();if(!u)return "";if(!/^https?:\/\//i.test(u))u="https://"+u;return u}
function urlPreviewData(raw){

  let host=url;try{host=new URL(url).hostname.replace(/^www\./,'')}catch(_){}
  const shot='https://image.thum.io/get/width/600/crop/400/noanimate/'+encodeURIComponent(url);

}

  }catch(e){list.innerHTML='<div class="mini">會員資料讀取失敗：'+escapeHtml(e?.message||String(e))+'</div>'}

/* ===== v23.1 AUTH WRITE LOCK =====
   登出後仍可瀏覽、切頁、看地圖/網址/照片；但禁止新增、修改、刪除、上傳與改本機資料。 */
function authWriteAllowed(){return !!supabaseSessionUser}
function authWriteToast(){toast("請先登入後再新增或修改資料")}
function applyLoggedOutWriteLock(){
  const logged=!!supabaseSessionUser;
  document.body.classList.toggle("loggedOutMode",!logged);
  const allowInputIds=new Set(["supabaseEmailInput","supabasePasswordInput"]);
  document.querySelectorAll('input,textarea,select').forEach(el=>{
    if(allowInputIds.has(el.id)){
      if(el.id==="supabaseEmailInput"||el.id==="supabasePasswordInput") el.disabled=logged;
      else el.disabled=false;
      el.classList.remove("authWriteLocked");
      return;
    }
    // hidden technical fields do not matter; all business-edit controls are locked while logged out
    if(!logged){el.disabled=true;el.classList.add("authWriteLocked")}
    else{el.disabled=false;el.classList.remove("authWriteLocked")}
  });
  document.querySelectorAll('[contenteditable="true"],#brandTitle').forEach(el=>{
    if(!logged){el.dataset.authPrevContenteditable=el.getAttribute("contenteditable")||"true";el.setAttribute("contenteditable","false");el.classList.add("authWriteLocked")}
    else if(el.dataset.authPrevContenteditable){el.setAttribute("contenteditable",el.dataset.authPrevContenteditable);delete el.dataset.authPrevContenteditable;el.classList.remove("authWriteLocked")}
  });
  const writeSelector=[
    '#addTripBtn','#startDateBtn','#endDateBtn','#mapSearchBtn','#addMarkerTypeBtn','#deleteMarkerTypeBtn',
    '#addScheduleBtn','#addBackupBtn','#addExpenseBtn','#addPayerBtn','#journalUploadBtn','#addJournalBtn',
    '#addPlanningBtn','#deleteSelectedBtn','#formConfirm','#bannerWrap',
    '.bookingAdd','.deleteBtn','.trashBtn','.photoX','.cloudLinkDelete','.markerEdit','.mapTrash','.dangerWide'
  ].join(',');
  document.querySelectorAll(writeSelector).forEach(el=>{
    if('disabled' in el) el.disabled=!logged;
    el.classList.toggle('authWriteLocked',!logged);
    if(!logged) el.setAttribute('aria-disabled','true'); else el.removeAttribute('aria-disabled');
  });
}
function installLoggedOutWriteGuard(){
  if(window.__nitaAuthWriteGuardInstalled)return;
  window.__nitaAuthWriteGuardInstalled=true;
  const writeSelector=[
    '#addTripBtn','#startDateBtn','#endDateBtn','#mapSearchBtn','#addMarkerTypeBtn','#deleteMarkerTypeBtn',
    '#addScheduleBtn','#addBackupBtn','#addExpenseBtn','#addPayerBtn','#journalUploadBtn','#addJournalBtn',
    '#addPlanningBtn','#deleteSelectedBtn','#formConfirm','#bannerWrap',
    '.bookingAdd','.deleteBtn','.trashBtn','.photoX','.cloudLinkDelete','.markerEdit','.mapTrash','.dangerWide',
    'label.smallBtn:has(input[type="file"])'
  ].join(',');
  document.addEventListener('click',e=>{
    if(supabaseSessionUser)return;
    const hit=e.target.closest?.(writeSelector);
    if(!hit)return;
    e.preventDefault();e.stopImmediatePropagation();authWriteToast();
  },true);
  document.addEventListener('beforeinput',e=>{
    if(supabaseSessionUser)return;
    const el=e.target;
    if(!el||el.id==='supabaseEmailInput'||el.id==='supabasePasswordInput')return;
    if(el.matches?.('input,textarea,[contenteditable]')){e.preventDefault();e.stopImmediatePropagation();authWriteToast()}
  },true);
  document.addEventListener('change',e=>{
    if(supabaseSessionUser)return;
    const el=e.target;
    if(!el||el.id==='supabaseEmailInput'||el.id==='supabasePasswordInput')return;
    if(el.matches?.('input,textarea,select')){e.preventDefault();e.stopImmediatePropagation();authWriteToast();applyLoggedOutWriteLock()}
  },true);
  new MutationObserver(()=>applyLoggedOutWriteLock()).observe(document.body,{childList:true,subtree:true});
}

async function compressImage(file,maxDim=1200,quality=.82){if(!file.type.startsWith("image/"))return "";const data=await fileToDataURL(file),img=await loadImage(data),scale=Math.min(1,maxDim/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",quality)}function fileToDataURL(file){return new Promise((r,j)=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=j;f.readAsDataURL(file)})}function loadImage(src){return new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src})}


function setGlobalHeaderCollapsed(collapsed){
  const app=$("appRoot"),btn=$("globalHeaderToggle");
  app.classList.toggle("headerCollapsed",!!collapsed);
  btn.textContent=collapsed?"⌄":"⌃";
  btn.setAttribute("aria-label",collapsed?"展開上方行程資訊":"收合上方行程資訊");
  // Google 地圖在容器尺寸改變後重新校正
  const active=document.querySelector(".page.active");
  if(active && active.id==="mapPage" && window.google && window.google.maps){
    setTimeout(()=>initGoogleMap(true),120);
  }
}
function syncGlobalHeaderToggle(pageId){
  const app=$("appRoot");
  const enable=pageId!=="schedulePage";
  app.classList.toggle("showGlobalHeaderToggle",enable);
  if(!enable)setGlobalHeaderCollapsed(false);
}
